name: Release

# 打 tag 即发布 Web 静态产物；也可以在 Actions 页面手动 Run workflow，只出产物不发 Release。
# 本项目尚未构建 Tauri/Capacitor 原生壳（缺 Rust 与 Android SDK），因此不会伪造 EXE/APK。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      is_tag: ${{ steps.v.outputs.is_tag }}
    steps:
      - id: v
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            IS_TAG="true"
          else
            VERSION="0.0.0-dev"
            IS_TAG="false"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag 不是 SemVer：v$VERSION"
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "is_tag=$IS_TAG"
          } >> "$GITHUB_OUTPUT"
          echo "版本：$VERSION（tag=$IS_TAG）"

  web:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: 质量门禁（类型 / lint / 单测 / 内容 / 审计 / build / size）
        run: |
          pnpm verify
          pnpm content:check --require-all

      - name: 校验站点产物
        run: |
          test -f apps/site/dist/index.html || { echo "::error::站点产物没就位"; exit 1; }
          find apps/site/dist -type f | wc -l

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/site/dist
          retention-days: 1

  e2e:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: 安装浏览器
        run: pnpm exec playwright install --with-deps chromium

      - name: 端到端（开发服务器）
        run: pnpm e2e

      - name: 端到端（生产产物）
        if: '!cancelled()'
        run: pnpm e2e:dist

      - name: 失败时保留截图与轨迹
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  release:
    needs: [version, web, e2e]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web-dist

      - name: 打包静态站点
        run: |
          set -euo pipefail
          mkdir -p files
          cd web-dist
          zip -qr "../files/mathmindforge-${{ needs.version.outputs.version }}-web.zip" .
          cd ..
          ls -lh files

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: files/*.zip
          generate_release_notes: true
          draft: false
          body: |
            ## 下载

            | 平台 | 文件 | 说明 |
            |---|---|---|
            | Web | mathmindforge-${{ needs.version.outputs.version }}-web.zip | 解压后静态托管；入口为 index.html |

            ## 说明

            本次发布仅包含 **Web 静态构建**。Windows EXE 与 Android APK 尚未包含：本项目尚无 Tauri/Capacitor 壳，且当前构建环境缺少 Rust 与 Android SDK。
            质量门禁：`pnpm verify`（120 单测 / 内容体检 / 关卡审计 / 体积）与 `pnpm e2e` / `pnpm e2e:dist` 均通过。

            ## 发布检查

            真人用户测试、原生壳与商店材料仍未完成；详见仓库 `docs/09-发布检查清单.md`。
